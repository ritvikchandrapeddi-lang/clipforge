version: '3.8'

services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: clipforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clipforge
      POSTGRES_USER: clipforge_user
      POSTGRES_PASSWORD: clipforge_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge_user -d clipforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: clipforge-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management HTTP UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clipforge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # Stateless Web Instances (Round-robin behind Nginx)
  # ============================================================================
  web1:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: clipforge-web-1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4001
      INSTANCE_ID: web-instance-1
      DATABASE_URL: postgresql://clipforge_user:clipforge_secret@postgres:5432/clipforge
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
    ports:
      - "4001:4001"
    volumes:
      - shared-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  web2:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: clipforge-web-2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4002
      INSTANCE_ID: web-instance-2
      DATABASE_URL: postgresql://clipforge_user:clipforge_secret@postgres:5432/clipforge
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
    ports:
      - "4002:4002"
    volumes:
      - shared-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # Nginx Load Balancer
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: clipforge-nginx
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2

  # ============================================================================
  # Independent Worker Pools
  # ============================================================================
  worker-validation:
    build:
      context: .
      dockerfile: ./workers/Dockerfile
    container_name: clipforge-worker-validation
    restart: unless-stopped
    environment:
      STAGE: validation
      WORKER_CONCURRENCY: 2
      DATABASE_URL: postgresql://clipforge_user:clipforge_secret@postgres:5432/clipforge
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
    volumes:
      - shared-storage:/app/storage
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-conversion:
    build:
      context: .
      dockerfile: ./workers/Dockerfile
    container_name: clipforge-worker-conversion
    restart: unless-stopped
    environment:
      STAGE: conversion
      WORKER_CONCURRENCY: 2
      DATABASE_URL: postgresql://clipforge_user:clipforge_secret@postgres:5432/clipforge
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
    volumes:
      - shared-storage:/app/storage
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-thumbnail:
    build:
      context: .
      dockerfile: ./workers/Dockerfile
    container_name: clipforge-worker-thumbnail
    restart: unless-stopped
    environment:
      STAGE: thumbnail
      WORKER_CONCURRENCY: 2
      DATABASE_URL: postgresql://clipforge_user:clipforge_secret@postgres:5432/clipforge
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
    volumes:
      - shared-storage:/app/storage
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  shared-storage:

